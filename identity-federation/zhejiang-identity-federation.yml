description: >-
  Zhejiang University's SAML 2.0 identity federation surface. This is the institution's
  only interfederated, third-party-registered, machine-readable contract: a Shibboleth
  Identity Provider under ZJU's own registrable domain, registered in CARSI (the CERNET
  Authentication and Resource Sharing Infrastructure, China's national research and
  education federation) and reachable through eduGAIN. Unlike the library catalog, the
  undergraduate teaching platform and the faculty profile system — all vendor software
  operating on ZJU hostnames — the IdP is operated by ZJU and the metadata describes
  ZJU's own infrastructure. The one caveat is significant and recorded below: the
  metadata ZJU serves at its own entityID is the stock Shibboleth installer artifact,
  never customised and expired since 2020-01-29, so the authoritative description of
  this entity is the CARSI/eduGAIN aggregate rather than the institution's own endpoint.

