findings:
  - id: metadata-expired
    severity: high
    detail: >-
      The document served at the entityID carries validUntil="2020-01-29T02:51:52.921Z".
      It has been expired for more than six years. A strict SAML consumer that fetches
      metadata directly from this endpoint and honours validUntil will reject it. The
      federated path works because CARSI republishes the entity into the eduGAIN
      aggregate; the institution's own endpoint does not carry a usable contract.
  - id: stock-installer-artifact
    severity: high
    detail: >-
      The file is the unmodified Shibboleth IdP installer output. It still opens with the
      distribution's "This is example metadata only. Do *NOT* supply it as is without
      review" banner, and still contains the commented-out template placeholders
      "A Name for the IdP at idp.zju.edu.cn" and "Enter a description of your IdP at
      idp.zju.edu.cn". No Organization block and no ContactPerson block were ever filled
      in, so the metadata carries no institutional identity, no support contact and no
      security contact.
  - id: legacy-protocol-retained
    severity: medium
    detail: >-
      SAML 1.1 and urn:mace:shibboleth:1.0 remain in the IDPSSODescriptor's
      protocolSupportEnumeration, and the AttributeAuthorityDescriptor advertises SAML 1.1
      only. Superseded protocol generations are still advertised with no published
      deprecation notice.
  - id: no-sirtfi
    severity: low
    detail: >-
      eduGAIN records sirtfi_status 0 and no Code of Conduct entity category for this
      entity. Both are voluntary trust-framework assertions that peers increasingly
      require.

