summary: >-
  ZJU publishes no error vocabulary. What follows is observed behaviour, recorded so
  the absence of a documented error contract is a measurement rather than an assumption.
  The mirror host returns honest status codes on negative probes; the library catalog
  host returns a genuine 403 with a human-readable explanation; the library CMS
  soft-404s, which is the one behaviour a consumer must defend against.
