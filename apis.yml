- aid: zhejiang:sso
  name: Unified Identity Authentication (CAS / SSO)
  x-operator: institution
  x-operator-basis: Host zjuam.zju.edu.cn is under zju.edu.cn, ZJU's own registrable domain.
  description: >-
    ZJU's unified identity authentication platform — a Central Authentication Service (CAS) single sign-on
    login fronting campus systems. It supports username/password, QR-code scanning and third-party hand-off
    (DingTalk, QQ, WeChat, and Azure/Microsoft for the international campus). Interactive web login only:
    no service-registration endpoint, no published API contract and no developer documentation are reachable
    unauthenticated. Recorded as an institution-operated surface, not as a consumable API.
  humanURL: https://zjuam.zju.edu.cn/cas/login?locale=en
  baseURL: https://zjuam.zju.edu.cn/cas/
