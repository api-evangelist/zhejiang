aid: zhejiang
name: Zhejiang University
x-type: university
x-category: Public Research University
description: >-
  Zhejiang University (浙江大学, ZJU) is a comprehensive public research university in
  Hangzhou, Zhejiang Province, China — a C9 League and Double First-Class institution,
  ranked in the QS World University Rankings top 50, with strengths across AI,
  engineering, medicine, agriculture and the sciences. ZJU operates no central developer
  portal, no open data portal, no institution-operated research data repository and no
  documented public application API. Its verified institution-operated programmable
  footprint is three surfaces, all under its own zju.edu.cn registrable domain: a public
  open source software mirror at mirrors.zju.edu.cn that publishes a genuinely
  machine-readable service catalog (the MirrorZ data contract, 63 mirrored repositories,
  anonymous read); a Shibboleth SAML 2.0 Identity Provider registered in CARSI and
  reachable through eduGAIN; and a CAS unified single sign-on platform. Everything else
  on the public estate is either vendor software running on a ZJU hostname — the Huiwen
  library catalog, the undergraduate teaching management platform, the faculty profile
  system — or is gated behind campus network access. The library catalog has been
  deliberately withdrawn from the public internet. No OpenAPI, AsyncAPI, GraphQL, MCP
  server, agent card, robots.txt, security.txt or llms.txt is published anywhere on the
  institution's own surface.
