apis:
  - aid: zhejiang:mirrors
    name: Open Source Software Mirror Service (MirrorZ catalog)
    x-operator: institution
    x-operator-basis: >-
      Host mirrors.zju.edu.cn is under zju.edu.cn, ZJU's own registrable domain. The
      catalog's own site.email is mirrors@zju.edu.cn. Maintained by the ZJU
      Supercomputing Team (ZJUSCT), a university group, not a vendor.
    description: >-
      浙江大学开源软件镜像站 — ZJU's public open source software mirror. The site publishes a
      machine-readable service catalog at /mirrorz.json implementing the MirrorZ data
      contract (self-declared version 1.7), listing 63 mirrored repositories with path,
      sync status token, upstream source, on-disk size and per-repository documentation
      link. Anonymous read, no authentication, no rate-limit headers, no CORS header.
      The repositories themselves are served as ordinary HTTPS directory trees. This is
      the only genuinely machine-readable API-shaped contract Zhejiang University
      operates itself. ZJU publishes no OpenAPI for it; the OpenAPI and JSON Schema
      registered below were derived by API Evangelist from the live response.
    humanURL: https://mirrors.zju.edu.cn/
    baseURL: https://mirrors.zju.edu.cn
