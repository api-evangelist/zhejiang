  - aid: zhejiang:shibboleth
    name: Shibboleth Identity Provider (SAML 2.0)
    x-operator: institution
    x-operator-basis: >-
      Host idp.zju.edu.cn is under zju.edu.cn. eduGAIN's registry names the entity
      "Zhejiang University" with scope zju.edu.cn under the CARSI registration authority.
    description: >-
      Zhejiang University operates a Shibboleth SAML 2.0 Identity Provider, entityID
      https://idp.zju.edu.cn/idp/shibboleth, registered in CARSI (the CERNET
      Authentication and Resource Sharing Infrastructure) and interfederated through
      eduGAIN since 2020-01-31. It advertises SingleSignOn, SingleLogout,
      ArtifactResolution and AttributeQuery endpoints across SAML 1.0, SAML 1.1, SAML 2.0
      and the Shibboleth-native binding. Caveat recorded honestly: the metadata served at
      the entityID is the unmodified Shibboleth installer artifact — validUntil
      2020-01-29, expired for six years, with no Organization or ContactPerson block and
      the template placeholders still commented in. Federated consumers work from the
      CARSI/eduGAIN aggregate, not from this endpoint.
    humanURL: https://idp.zju.edu.cn/idp/shibboleth
    baseURL: https://idp.zju.edu.cn/idp/
    tags: [Identity Federation, SAML, Shibboleth, Single Sign-On, eduGAIN, CARSI]
    properties:
      - type: IdentityFederation
        url: https://idp.zju.edu.cn/idp/shibboleth
      - type: Metadata
        url: identity-federation/zhejiang-idp-saml-metadata.xml
      - type: IdentityFederation
        url: identity-federation/zhejiang-identity-federation.yml
      - type: Conformance
        url: conformance/zhejiang-education-standards.yml
      - type: Authentication
        url: authentication/zhejiang-authentication.yml
  - aid: zhejiang:sso
    name: Unified Identity Authentication (CAS / SSO)
    x-operator: institution
    x-operator-basis: Host zjuam.zju.edu.cn is under zju.edu.cn, ZJU's own registrable domain.
    description: >-
      ZJU's unified identity authentication platform — a Central Authentication Service
      (CAS) single sign-on login fronting campus systems. It supports username/password,
      QR-code scanning and third-party hand-off (DingTalk, QQ, WeChat, and Azure/Microsoft
      for the international campus). Interactive web login only: no service-registration
      endpoint, no published API contract and no developer documentation are reachable
      unauthenticated. Recorded as an institution-operated surface, not as a consumable API.
    humanURL: https://zjuam.zju.edu.cn/cas/login?locale=en
    baseURL: https://zjuam.zju.edu.cn/cas/
    tags: [Identity, Single Sign-On, Authentication, CAS]
    properties:
