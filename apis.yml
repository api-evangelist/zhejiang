apis:
- aid: zhejiang:shibboleth
  name: Shibboleth Identity Provider (SAML 2.0)
  x-operator: institution
  x-operator-basis: >-
    Host idp.zju.edu.cn is under zju.edu.cn. eduGAIN's registry names the entity "Zhejiang University"
    with scope zju.edu.cn under the CARSI registration authority.
  description: >-
    Zhejiang University operates a Shibboleth SAML 2.0 Identity Provider, entityID https://idp.zju.edu.cn/idp/shibboleth,
    registered in CARSI (the CERNET Authentication and Resource Sharing Infrastructure) and interfederated
    through eduGAIN since 2020-01-31. It advertises SingleSignOn, SingleLogout, ArtifactResolution and
    AttributeQuery endpoints across SAML 1.0, SAML 1.1, SAML 2.0 and the Shibboleth-native binding. Caveat
    recorded honestly: the metadata served at the entityID is the unmodified Shibboleth installer artifact
    — validUntil 2020-01-29, expired for six years, with no Organization or ContactPerson block and the
    template placeholders still commented in. Federated consumers work from the CARSI/eduGAIN aggregate,
    not from this endpoint.
  humanURL: https://idp.zju.edu.cn/idp/shibboleth
  baseURL: https://idp.zju.edu.cn/idp/
