x-coverage:
  state: covered
  reason: institution_surface_verified
  detail: >-
    Three institution-operated surfaces confirmed live under Zhejiang University's own
    registrable domain zju.edu.cn, one of which publishes a real machine-readable
    contract: the MirrorZ service catalog at mirrors.zju.edu.cn/mirrorz.json (200,
    application/json, 63 mirrors, validated against the upstream MirrorZ JSON Schema).
    The SAML 2.0 / Shibboleth IdP at idp.zju.edu.cn is institution-operated and
    third-party-registered in eduGAIN via CARSI, evidencing two education-regime domain
    standards — though the document it serves is an expired, uncustomised installer
    artifact. Two further surfaces are real institutional facts but are gated: the
    library catalog at opac.zju.edu.cn returns a deliberate 403 stating public-internet
    service has been suspended in favour of WebVPN, and the undergraduate teaching
    platform at zdbk.zju.edu.cn is a login-only vendor system. NO tenant relationship on
    a research-data platform was found — there is no Figshare, Pure, Dataverse, DSpace or
    Symplectic surface under zju.edu.cn, so no vendor contract is attributed here. There
    is no open data portal, no institution-operated OAI-PMH endpoint (libweb.zju.edu.cn
    soft-404s on /oai, returning HTTP 200 with a CMS error body — deliberately not
    credited), and no central developer portal.
